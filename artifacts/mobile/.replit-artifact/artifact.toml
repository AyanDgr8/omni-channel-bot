kind = "mobile"
previewPath = "/mobile/"
title = "VoxAgent Mobile"
description = "A mobile companion app for VoxAgent AI voice bot platform. Lets managers monitor live calls, activate personas, view call history, and send call summaries — all from their phone. Dark navy theme matching the web dashboard."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
