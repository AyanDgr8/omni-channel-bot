openapi: "3.1.0"
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: "1.0.0"
  description: VoxAgent AI Voice Bot Platform API

servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Calls ───────────────────────────────────────────────────────
  /v1/calls:
    get:
      operationId: listCalls
      summary: List calls with filters
      parameters:
        - in: query
          name: direction
          schema:
            type: string
            enum: [INBOUND, OUTBOUND]
        - in: query
          name: hangupReason
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: botId
          schema:
            type: string
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallList"

  /v1/calls/dial:
    post:
      operationId: dialCall
      summary: Initiate an outbound call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialInput"
      responses:
        "201":
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Bad request
  /v1/calls/outbound:
    post:
      operationId: outboundCall
      summary: Initiate an outbound call (compatibility alias for dial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialInput"
      responses:
        "201":
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /v1/calls/inbound:
    post:
      operationId: receiveInboundCall
      summary: Webhook — incoming call arrives; stamps active persona at call-start
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundCallInput"
      responses:
        "201":
          description: Inbound call record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "400":
          description: Bad request

  /v1/calls/{id}:
    get:
      operationId: getCall
      summary: Get call details and status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Call details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found
    delete:
      operationId: hangupCall
      summary: Hang up an active call
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Call hung up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /v1/calls/{id}/transfer:
    post:
      operationId: transferCall
      summary: Transfer call to extension or number
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /v1/calls/{id}/dtmf:
    post:
      operationId: sendCallDtmf
      summary: Send one DTMF digit to an owned active SIP call
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallDtmfInput"
      responses:
        "200":
          description: DTMF accepted by the telephony worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SipActionResult"
        "400":
          description: Invalid DTMF digit
        "404":
          description: Active call not found
        "409":
          description: Call does not use SIP transport

  /v1/calls/{id}/conference:
    post:
      operationId: conferenceCall
      summary: Add a party to a conference
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConferenceInput"
      responses:
        "200":
          description: Conference created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"
        "404":
          description: Not found

  /v1/calls/{id}/media-events:
    post:
      operationId: recordCallMediaEvent
      summary: Persist an authenticated telephony disclosure or recording-consent event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallMediaEventInput"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  # ─── Compliance ─────────────────────────────────────────────────
  /v1/compliance/dnc:
    get:
      operationId: listDncEntries
      summary: List tenant do-not-call entries
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: DNC entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DncEntry"
    post:
      operationId: createDncEntry
      summary: Add a tenant do-not-call entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DncEntryInput"
      responses:
        "201":
          description: DNC entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DncEntry"
  /v1/compliance/dnc/{id}:
    delete:
      operationId: deleteDncEntry
      summary: Remove a tenant do-not-call entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DNC entry removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DncEntry"
  /v1/compliance/dnc/import:
    post:
      operationId: importDncCsv
      summary: Import DNC phone numbers from CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DncCsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
  /v1/compliance/dnc/export:
    get:
      operationId: exportDncCsv
      summary: Export tenant DNC entries as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /v1/compliance/consents:
    get:
      operationId: listConsentLedger
      summary: List tenant consent events
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Consent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentEntry"
    post:
      operationId: recordConsent
      summary: Record a grant or revocation consent event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "201":
          description: Consent event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentEntry"
  /v1/compliance/consents/{id}/revoke:
    post:
      operationId: revokeConsent
      summary: Revoke a consent ledger entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Revocation event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentEntry"
  /v1/compliance/profiles:
    get:
      operationId: listComplianceProfiles
      summary: List tenant jurisdiction profiles
      responses:
        "200":
          description: Jurisdiction profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceProfile"
  /v1/compliance/profiles/{jurisdictionCode}:
    put:
      operationId: updateComplianceProfile
      summary: Create or update a jurisdiction profile
      parameters:
        - in: path
          name: jurisdictionCode
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplianceProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceProfile"
  /v1/compliance/evidence:
    get:
      operationId: listComplianceEvidence
      summary: List compliance decision evidence
      responses:
        "200":
          description: Compliance decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComplianceEvidence"
  /v1/compliance/evidence/export:
    get:
      operationId: exportComplianceEvidenceCsv
      summary: Export compliance decision evidence as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
  /v1/compliance/opt-out:
    post:
      operationId: recordInCallOptOut
      summary: Add a caller to DNC during a live call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptOutInput"
      responses:
        "201":
          description: Opt-out recorded
          content:
            application/json:
              schema:
                type: object

  # ─── Campaigns ──────────────────────────────────────────────────
  /v1/campaigns:
    get:
      operationId: listCampaigns
      summary: List tenant campaigns with queue metrics
      responses:
        "200":
          description: Campaigns
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Campaign" } } } }
    post:
      operationId: createCampaign
      summary: Create an outbound campaign draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignInput" } } } }
      responses: { "201": { description: Campaign created, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } } }
  /v1/campaigns/{id}:
    get:
      operationId: getCampaign
      summary: Get a campaign and queue metrics
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      responses: { "200": { description: Campaign, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }, "404": { description: Not found } }
    patch:
      operationId: updateCampaign
      summary: Update campaign settings or make a valid lifecycle transition
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignUpdate" } } } }
      responses: { "200": { description: Campaign updated, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }, "409": { description: Invalid lifecycle transition } }
  /v1/campaigns/{id}/stop:
    post:
      operationId: stopCampaign
      summary: Permanently stop a campaign; stopped campaigns cannot be restarted
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      responses: { "200": { description: Campaign stopped, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } } }
  /v1/campaigns/{id}/clone:
    post:
      operationId: cloneCampaign
      summary: Create a DRAFT A/B variant of a campaign
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCloneInput" } } } }
      responses: { "201": { description: Draft variant, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } } }
  /v1/campaigns/{id}/contacts/import:
    post:
      operationId: importCampaignContacts
      summary: Preview or import CSV contacts after column mapping and compliance evaluation
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCsvImportInput" } } } }
      responses: { "200": { description: Import preview or result, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignImportReport" } } } } }
  /v1/campaigns/{id}/contacts:
    get:
      operationId: listCampaignContacts
      summary: List campaign queue contacts
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      responses: { "200": { description: Contacts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignContact" } } } } } }
  /v1/campaigns/{id}/dispositions:
    get:
      operationId: listCampaignDispositions
      summary: Monitor dispositions or export them as CSV
      parameters: [ { $ref: "#/components/parameters/CampaignId" }, { in: query, name: format, schema: { type: string, enum: [csv] } } ]
      responses: { "200": { description: Dispositions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignDisposition" } } }, text/csv: { schema: { type: string } } } } }
  /v1/campaigns/{id}/callbacks:
    get:
      operationId: listCampaignCallbacks
      summary: List scheduled callbacks for a campaign
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      responses: { "200": { description: Callbacks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CampaignCallback" } } } } } }
    post:
      operationId: createCampaignCallback
      summary: Schedule a callback for a campaign contact
      parameters: [ { $ref: "#/components/parameters/CampaignId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCallbackInput" } } } }
      responses: { "201": { description: Callback scheduled, content: { application/json: { schema: { $ref: "#/components/schemas/CampaignCallback" } } } } }

  # ─── Dashboard Stats ──────────────────────────────────────────────
  /v1/stats/overview:
    get:
      operationId: getStatsOverview
      summary: Dashboard overview statistics
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /v1/stats/calls-by-hour:
    get:
      operationId: getCallsByHour
      summary: Call volume by hour for the last 24h
      responses:
        "200":
          description: Hourly call data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourlyCallStat"

  /v1/stats/hangup-reasons:
    get:
      operationId: getHangupReasons
      summary: Distribution of hangup reasons
      responses:
        "200":
          description: Hangup reason breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HangupReasonStat"

  /v1/stats/connect-outcomes:
    get:
      operationId: getConnectOutcomes
      summary: Distribution of call connection outcomes
      responses:
        "200":
          description: Connection outcome breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectOutcomeStat"

  /v1/stats/language-mix:
    get:
      operationId: getLanguageMix
      summary: Distribution of detected languages
      responses:
        "200":
          description: Detected language breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageMixStat"

  /v1/stats/call-intelligence:
    get:
      operationId: getCallIntelligence
      summary: Call interruption and escalation metrics
      responses:
        "200":
          description: Call intelligence metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallIntelligence"

  # ─── Bots ─────────────────────────────────────────────────────────
  /v1/bots:
    get:
      operationId: listBots
      summary: List all registered bots
      responses:
        "200":
          description: List of bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bot"
    post:
      operationId: createBot
      summary: Register a new bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotInput"
      responses:
        "201":
          description: Bot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"

  /v1/bots/{id}:
    get:
      operationId: getBot
      summary: Get bot details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Not found
    patch:
      operationId: updateBot
      summary: Update bot configuration
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotUpdate"
      responses:
        "200":
          description: Bot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Not found
    delete:
      operationId: deleteBot
      summary: Delete a bot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /v1/bots/{id}/sip:
    get:
      operationId: getSipConfig
      summary: Get a bot's SIP configuration (credentials are write-only)
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      responses:
        "200": { description: SIP configuration, content: { application/json: { schema: { $ref: "#/components/schemas/SipConfig" } } } }
    put:
      operationId: updateSipConfig
      summary: Create or update a bot's SIP configuration
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SipConfigInput" } } } }
      responses:
        "200": { description: SIP configuration, content: { application/json: { schema: { $ref: "#/components/schemas/SipConfig" } } } }
  /v1/bots/{id}/sip/register:
    post:
      operationId: registerSip
      summary: Register this bot's SIP gateway
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      responses: { "200": { description: Registration requested, content: { application/json: { schema: { $ref: "#/components/schemas/SipActionResult" } } } } }
  /v1/bots/{id}/sip/unregister:
    post:
      operationId: unregisterSip
      summary: Unregister this bot's SIP gateway
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      responses: { "200": { description: Unregistration requested, content: { application/json: { schema: { $ref: "#/components/schemas/SipActionResult" } } } } }
  /v1/bots/{id}/sip/test-call:
    post:
      operationId: testSipCall
      summary: Place a SIP test call
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SipTestCallInput" } } } }
      responses: { "200": { description: Test call requested, content: { application/json: { schema: { $ref: "#/components/schemas/SipActionResult" } } } } }
  /v1/bots/{id}/sip/status:
    get:
      operationId: getSipStatus
      summary: Get SIP registration status
      parameters: [ { $ref: "#/components/parameters/BotId" } ]
      responses: { "200": { description: SIP status, content: { application/json: { schema: { $ref: "#/components/schemas/SipStatus" } } } } }
  /v1/bots/{id}/sip/events:
    get:
      operationId: listSipEvents
      summary: List recent SIP events
      parameters:
        - $ref: "#/components/parameters/BotId"
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: level, schema: { type: string, enum: [debug, info, warn, error] } }
      responses: { "200": { description: SIP events, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SipEvent" } } } } } }
  /v1/sip/health:
    get:
      operationId: getSipHealth
      summary: Get external FreeSWITCH worker health
      responses: { "200": { description: Worker health, content: { application/json: { schema: { $ref: "#/components/schemas/SipHealth" } } } } }

  # ─── Config ───────────────────────────────────────────────────────
  /v1/config/persona:
    get:
      operationId: getPersonaConfig
      summary: Get current persona configuration
      responses:
        "200":
          description: Persona config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaConfig"
    put:
      operationId: updatePersonaConfig
      summary: Update persona configuration (hot-reload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaConfigInput"
      responses:
        "200":
          description: Persona updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaConfig"

  /v1/config/conversation:
    get:
      operationId: getConversationConfig
      summary: Get conversation pacing configuration
      responses:
        "200":
          description: Conversation config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationConfig"
    put:
      operationId: updateConversationConfig
      summary: Update conversation pacing configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationConfigInput"
      responses:
        "200":
          description: Conversation config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationConfig"

  /v1/config/llm:
    get:
      operationId: getLlmConfig
      summary: Get LLM engine configuration
      responses:
        "200":
          description: LLM config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConfig"
    put:
      operationId: updateLlmConfig
      summary: Update LLM engine configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigInput"
      responses:
        "200":
          description: LLM config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConfig"

  # ─── Memory ───────────────────────────────────────────────────────
  /v1/memory/entries:
    get:
      operationId: listMemoryEntries
      summary: List all memory entries with stats
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntryList"
    post:
      operationId: createMemoryEntry
      summary: Add a new Q&A memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /v1/memory/entries/{id}:
    put:
      operationId: updateMemoryEntry
      summary: Update a memory entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryUpdate"
      responses:
        "200":
          description: Entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteMemoryEntry
      summary: Delete a memory entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /v1/memory/stats:
    get:
      operationId: getMemoryStats
      summary: Get memory system hit rate and cache stats
      responses:
        "200":
          description: Memory stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryStats"

  /v1/memory/train:
    post:
      operationId: trainMemory
      summary: Trigger embedding reindex for memory training
      responses:
        "200":
          description: Training started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainResult"

  # ─── Calendar ─────────────────────────────────────────────────────
  /v1/calendar/invite:
    post:
      operationId: createCalendarInvite
      summary: Create and send a calendar invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarInviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarInvite"

  /v1/calendar/slots:
    get:
      operationId: getAvailableSlots
      summary: Get available calendar slots
      parameters:
        - in: query
          name: email
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  # ─── Messaging ────────────────────────────────────────────────────
  /v1/messaging/whatsapp:
    post:
      operationId: sendWhatsApp
      summary: Send a WhatsApp message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppMessageInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /v1/messaging/telegram:
    post:
      operationId: sendTelegram
      summary: Send a Telegram message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramMessageInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  /v1/messaging/email:
    post:
      operationId: sendEmail
      summary: Send an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailMessageInput"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResult"

  # ─── Personas ────────────────────────────────────────────────────
  /v1/personas:
    get:
      operationId: listPersonas
      summary: List all personas
      responses:
        "200":
          description: List of personas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonaSummary"

  /v1/personas/{id}:
    get:
      operationId: getPersona
      summary: Get persona details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persona details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaSummary"
        "404":
          description: Not found

  /v1/personas/{id}/activate:
    post:
      operationId: activatePersona
      summary: Activate a persona (set as active)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Persona activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaSummary"
        "404":
          description: Not found

  /v1/messaging/logs:
    get:
      operationId: listMessageLogs
      summary: List message delivery logs
      parameters:
        - in: query
          name: channel
          schema:
            type: string
            enum: [whatsapp, telegram, email]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Message logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageLog"

components:
  parameters:
    CampaignId:
      in: path
      name: id
      required: true
      schema: { type: string }
    BotId:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    Campaign:
      type: object
      required: [id, tenantId, botId, name, status, concurrencyCap, scheduleJson, metrics, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        botId: { type: string }
        name: { type: string }
        objectivePrompt: { type: string }
        status: { type: string, enum: [DRAFT, SCHEDULED, RUNNING, PAUSED, COMPLETED, STOPPED] }
        scheduleJson: { type: object, additionalProperties: true }
        callingWindowOverride: { type: [object, "null"], additionalProperties: true }
        concurrencyCap: { type: integer, minimum: 1, maximum: 50 }
        retryPolicyJson: { type: object, additionalProperties: true }
        successFieldsJson: { type: array, items: { type: string } }
        cliNumber: { type: [string, "null"] }
        voicemailScript: { type: [string, "null"] }
        abVariantOf: { type: [string, "null"] }
        metrics: { type: object, additionalProperties: { type: integer } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CampaignInput:
      type: object
      required: [name, botId]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        botId: { type: string }
        objectivePrompt: { type: string }
        scheduleJson: { type: object, additionalProperties: true }
        callingWindowOverride: { type: [object, "null"], additionalProperties: true }
        concurrencyCap: { type: integer, minimum: 1, maximum: 50 }
        retryPolicyJson: { type: object, additionalProperties: true }
        successFieldsJson: { type: array, items: { type: string } }
        cliNumber: { type: [string, "null"] }
        voicemailScript: { type: [string, "null"] }
    CampaignUpdate:
      allOf: [ { $ref: "#/components/schemas/CampaignInput" } ]
      properties:
        status: { type: string, enum: [DRAFT, SCHEDULED, RUNNING, PAUSED, COMPLETED, STOPPED] }
    CampaignCloneInput:
      type: object
      properties: { name: { type: string }, copyContacts: { type: boolean, default: false } }
    CampaignCsvImportInput:
      type: object
      required: [csv, phoneColumn]
      properties:
        csv: { type: string }
        phoneColumn: { type: string }
        variableColumns: { type: array, items: { type: string } }
        mapping: { type: object, additionalProperties: { type: string } }
        previewOnly: { type: boolean, default: false }
    CampaignImportReport:
      type: object
      required: [headers, total, allowed, blocked, rows]
      properties:
        headers: { type: array, items: { type: string } }
        total: { type: integer }
        allowed: { type: integer }
        blocked: { type: integer }
        rows: { type: array, items: { type: object, additionalProperties: true } }
    CampaignContact:
      type: object
      required: [id, campaignId, phoneE164, state, attempts]
      properties:
        id: { type: string }
        campaignId: { type: string }
        phoneE164: { type: string }
        variablesJson: { type: object, additionalProperties: true }
        state: { type: string, enum: [PENDING, IN_FLIGHT, BLOCKED, DONE] }
        attempts: { type: integer }
        nextAttemptAt: { type: string, format: date-time }
        lastDisposition: { type: [string, "null"] }
        blockReason: { type: [string, "null"] }
        callId: { type: [string, "null"] }
    CampaignDisposition:
      type: object
      required: [id, campaignId, callId, code, createdAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        callId: { type: string }
        code: { type: string }
        summaryText: { type: [string, "null"] }
        extractedFieldsJson: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    CampaignCallback:
      type: object
      required: [id, campaignId, campaignContactId, scheduledFor, fulfilled, createdAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        campaignContactId: { type: string }
        callId: { type: [string, "null"] }
        scheduledFor: { type: string, format: date-time }
        note: { type: [string, "null"] }
        fulfilled: { type: boolean }
        createdAt: { type: string, format: date-time }
    CampaignCallbackInput:
      type: object
      required: [campaignContactId, scheduledFor]
      properties:
        campaignContactId: { type: string }
        scheduledFor: { type: string, format: date-time }
        note: { type: string }
        callId: { type: string }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Call schemas ─────────────────────────────────────────────
    Call:
      type: object
      required: [id, botId, direction, status, createdAt]
      properties:
        id:
          type: string
        botId:
          type: string
        direction:
          type: string
          enum: [INBOUND, OUTBOUND]
        status:
          type: string
          enum: [INITIATING, RINGING, IN_PROGRESS, COMPLETED, FAILED]
        customerNumber:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        durationSeconds:
          type: ["integer", "null"]
        hangupReason:
          type: ["string", "null"]
        sipCode:
          type: ["integer", "null"]
        amdResult:
          type: ["string", "null"]
        languageDetected:
          type: ["string", "null"]
        recordingUrl:
          type: ["string", "null"]
        summary:
          type: ["string", "null"]
        transferTarget:
          type: ["string", "null"]
        followUpSent:
          type: boolean
        personaId:
          type: ["string", "null"]
          description: ID of the persona that was active when this call started
        composedPrompt:
          type: ["string", "null"]
          description: Fully-composed system prompt injected for this call
        personaName:
          type: ["string", "null"]
        personaVersion:
          type: ["integer", "null"]
        connectOutcome:
          type: ["string", "null"]
        interruptionCount:
          type: integer
        escalationCount:
          type: integer
        languageSwitches:
          type: ["array", "null"]
          items: { type: object, additionalProperties: true }
        finalDisposition:
          type: ["string", "null"]
        disclosureText:
          type: ["string", "null"]
        disclosurePlayedAt:
          type: ["string", "null"]
          format: date-time
        recordingConsentStatus:
          type: ["string", "null"]
        recordingConsentAt:
          type: ["string", "null"]
          format: date-time
        complianceDecisionId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CallList:
      type: object
      required: [calls, total]
      properties:
        calls:
          type: array
          items:
            $ref: "#/components/schemas/Call"
        total:
          type: integer

    DialInput:
      type: object
      required: [to, botId]
      properties:
        to:
          type: string
          description: E.164 phone number
        from:
          type: ["string", "null"]
          description: Caller ID (E.164)
        botId:
          type: string
        maxRingSeconds:
          type: integer
          default: 30
        maxAttempts:
          type: integer
          default: 3

    InboundCallInput:
      type: object
      required: [from, botId]
      properties:
        from:
          type: string
          description: Caller's E.164 phone number
        botId:
          type: string
        to:
          type: ["string", "null"]
          description: Dialed number (DID) that received the call

    DncEntry:
      type: object
      required: [id, tenantId, phoneNumber, source, addedAt, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        phoneNumber: { type: string }
        source: { type: string }
        reason: { type: ["string", "null"] }
        addedAt: { type: string, format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        createdByUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    DncEntryInput:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string }
        source: { type: string }
        reason: { type: string }
        expiresAt: { type: ["string", "null"], format: date-time }

    DncCsvImportInput:
      type: object
      required: [csv]
      properties:
        csv: { type: string }

    ConsentEntry:
      type: object
      required: [id, tenantId, phoneNumber, consentType, status, source, capturedAt, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        phoneNumber: { type: string }
        consentType: { type: string, enum: [VOICE_CALLING, RECORDING] }
        status: { type: string, enum: [GRANTED, REVOKED] }
        source: { type: string }
        capturedAt: { type: string, format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        evidence: { type: ["string", "null"] }
        actorUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    ConsentInput:
      type: object
      required: [phoneNumber, consentType, status]
      properties:
        phoneNumber: { type: string }
        consentType: { type: string, enum: [VOICE_CALLING, RECORDING] }
        status: { type: string, enum: [GRANTED, REVOKED] }
        source: { type: string }
        evidence: { type: string }
        expiresAt: { type: ["string", "null"], format: date-time }

    ComplianceProfile:
      type: object
      required: [id, tenantId, jurisdictionCode, displayName, enabled, timezone, callingWindowStart, callingWindowEnd, allowedDays, holidays, requireConsent, requireRecordingConsent, blockOnHoliday, createdAt, updatedAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        jurisdictionCode: { type: string }
        displayName: { type: string }
        enabled: { type: boolean }
        timezone: { type: string }
        callingWindowStart: { type: string }
        callingWindowEnd: { type: string }
        allowedDays:
          type: array
          items: { type: string }
        holidays:
          type: array
          items: { type: string }
        requireConsent: { type: boolean }
        requireRecordingConsent: { type: boolean }
        mandatoryDisclosureText: { type: ["string", "null"] }
        blockOnHoliday: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ComplianceProfileInput:
      type: object
      required: [displayName, timezone, callingWindowStart, callingWindowEnd, allowedDays, requireConsent, requireRecordingConsent, blockOnHoliday]
      properties:
        displayName: { type: string }
        enabled: { type: boolean }
        timezone: { type: string }
        callingWindowStart: { type: string }
        callingWindowEnd: { type: string }
        allowedDays:
          type: array
          items: { type: string }
        holidays:
          type: array
          items: { type: string }
        requireConsent: { type: boolean }
        requireRecordingConsent: { type: boolean }
        mandatoryDisclosureText: { type: ["string", "null"] }
        blockOnHoliday: { type: boolean }

    ComplianceEvidence:
      type: object
      required: [id, tenantId, botId, phoneNumber, direction, decision, reasonCode, reason, jurisdictionCode, calledPartyTimezone, recordingConsentRequired, evaluatedAt, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        callId: { type: ["string", "null"] }
        botId: { type: string }
        phoneNumber: { type: string }
        direction: { type: string }
        decision: { type: string, enum: [ALLOWED, BLOCKED] }
        reasonCode: { type: string }
        reason: { type: string }
        jurisdictionCode: { type: string }
        calledPartyTimezone: { type: string }
        disclosureText: { type: ["string", "null"] }
        recordingConsentRequired: { type: boolean }
        evaluatedAt: { type: string, format: date-time }
        metadataJson: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }

    CsvImportResult:
      type: object
      required: [imported, rejected, errors]
      properties:
        imported: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          items: { type: string }

    OptOutInput:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber: { type: string }
        callId: { type: string }
        reason: { type: string }

    CallMediaEventInput:
      type: object
      required: [event, evidence]
      properties:
        event: { type: string, enum: [DISCLOSURE_PLAYED, RECORDING_CONSENT_GRANTED, RECORDING_CONSENT_DECLINED] }
        evidence: { type: string }
        occurredAt: { type: string, format: date-time }

    TransferInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [BLIND, ATTENDED]
        extension:
          type: ["string", "null"]
        e164:
          type: ["string", "null"]
        agentName:
          type: ["string", "null"]
        announceMessage:
          type: ["string", "null"]
        waitTimeoutSeconds:
          type: integer
          default: 20

    ConferenceInput:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: E.164 number or extension to add
        dropBotAfterConnect:
          type: boolean
          default: false

    # ─── Stats schemas ────────────────────────────────────────────
    StatsOverview:
      type: object
      required: [totalCalls, activeCalls, completedToday, successRate, avgDurationSeconds, amdAccuracy, memoryHitRate, totalBots]
      properties:
        totalCalls:
          type: integer
        activeCalls:
          type: integer
        completedToday:
          type: integer
        successRate:
          type: number
        avgDurationSeconds:
          type: number
        amdAccuracy:
          type: number
        memoryHitRate:
          type: number
        totalBots:
          type: integer

    HourlyCallStat:
      type: object
      required: [hour, inbound, outbound]
      properties:
        hour:
          type: string
        inbound:
          type: integer
        outbound:
          type: integer

    HangupReasonStat:
      type: object
      required: [reason, count, percentage]
      properties:
        reason:
          type: string
        count:
          type: integer
        percentage:
          type: number

    ConnectOutcomeStat:
      type: object
      required: [outcome, count, percentage]
      properties:
        outcome: { type: string }
        count: { type: integer }
        percentage: { type: number }

    LanguageMixStat:
      type: object
      required: [language, count, percentage]
      properties:
        language: { type: string }
        count: { type: integer }
        percentage: { type: number }

    CallIntelligence:
      type: object
      required: [totalAnalyzed, avgInterruptionsPerCall, avgEscalationsPerCall, bargeInRate, avgLanguageSwitchesPerCall, timeSeries]
      properties:
        totalAnalyzed: { type: integer }
        avgInterruptionsPerCall: { type: number }
        avgEscalationsPerCall: { type: number }
        bargeInRate: { type: number }
        avgLanguageSwitchesPerCall: { type: number }
        timeSeries:
          type: array
          items:
            $ref: "#/components/schemas/CallIntelligencePoint"

    CallIntelligencePoint:
      type: object
      required: [date, callsAnalyzed, avgInterruptionsPerCall, bargeInRate, escalationRate]
      properties:
        date: { type: string }
        callsAnalyzed: { type: integer }
        avgInterruptionsPerCall: { type: number }
        bargeInRate: { type: number }
        escalationRate: { type: number }

    # ─── Bot schemas ──────────────────────────────────────────────
    Bot:
      type: object
      required: [id, displayName, sipExtension, status, direction, supportedLanguages, defaultGreetingLanguage, timezone, endpointSilenceMs, backchannelThresholdMs, silenceRecoverySecs, activeCalls, createdAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: ["string", "null"]
        sipExtension:
          type: string
        sipDomain:
          type: ["string", "null"]
        telephonyType:
          type: string
          enum: [webrtc, sip]
          default: webrtc
        whatsappNumber:
          type: ["string", "null"]
        status:
          type: string
          enum: [ONLINE, OFFLINE, BUSY, ERROR]
        activeCalls:
          type: integer
          default: 0
        direction:
          type: string
          enum: [inbound, outbound]
          default: inbound
        directionConfig:
          nullable: true
          type: object
          additionalProperties: true
        supportedLanguages:
          type: array
          items:
            type: string
          default: ["en"]
        defaultGreetingLanguage:
          type: string
          default: "en"
        timezone:
          type: string
          default: "UTC"
        endpointSilenceMs:
          type: integer
          default: 1200
        backchannelThresholdMs:
          type: integer
          default: 700
        silenceRecoverySecs:
          type: integer
          default: 6
        llmChainJson:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        sttMapJson:
          type: ["object", "null"]
          additionalProperties: true
        ttsMapJson:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    BotInput:
      type: object
      required: [displayName, sipExtension]
      properties:
        displayName:
          type: string
        email:
          type: ["string", "null"]
        sipExtension:
          type: string
        sipDomain:
          type: ["string", "null"]
        telephonyType:
          type: string
          enum: [webrtc, sip]
          default: webrtc
        whatsappNumber:
          type: ["string", "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        directionConfig:
          type: object
          additionalProperties: true
        supportedLanguages:
          type: array
          items:
            type: string
        defaultGreetingLanguage:
          type: string
        timezone:
          type: string
        endpointSilenceMs:
          type: integer
        backchannelThresholdMs:
          type: integer
        silenceRecoverySecs:
          type: integer
        llmChainJson:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        sttMapJson:
          type: ["object", "null"]
          additionalProperties: true
        ttsMapJson:
          type: ["object", "null"]
          additionalProperties: true

    BotUpdate:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: ["string", "null"]
        sipExtension:
          type: string
        sipDomain:
          type: ["string", "null"]
        telephonyType:
          type: string
          enum: [webrtc, sip]
        whatsappNumber:
          type: ["string", "null"]
        status:
          type: string
          enum: [ONLINE, OFFLINE, BUSY, ERROR]
        direction:
          type: string
          enum: [inbound, outbound]
        directionConfig:
          type: object
          additionalProperties: true
        supportedLanguages:
          type: array
          items:
            type: string
        defaultGreetingLanguage:
          type: string
        timezone:
          type: string
        endpointSilenceMs:
          type: integer
        backchannelThresholdMs:
          type: integer
        silenceRecoverySecs:
          type: integer
        llmChainJson:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        sttMapJson:
          type: ["object", "null"]
          additionalProperties: true
        ttsMapJson:
          type: ["object", "null"]
